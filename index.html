<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="Pre1.css">
    <title>Lecteur RSVP</title>

    
</head>

<body>

    <h1>RSVP Reader</h1>

	<div class = "container">
		<input id="fileInput" type="file" hidden accept=".txt, .epub">
	
		<button class="uploadBtn" id="uploadBtn">Upload File</button>

		<div id="wordDisplay">
			Chargez un livre
		</div>

		<div id="actionBar">
			<button id="rwdBtn">Rewind</button>
			<button id="multiBtn">Start</button>
		</div>
		
		<div id="navBar">
			<button id="previousChapterBtn" class="navButton">&lt;&lt;</button>
			<h1 id="navDisplay">Chapitre #</h1>
			<button id="nextChapterBtn" class="navButton">&gt;&gt;</button>
		</div>
	
		<div id="speedBar">
			<button id="minusSpeedBtn" class="speedButton">-</button>
			<h1 id="speedDisplay"># WPM</h1>
			<button id="plusSpeedBtn" class="speedButton">+</button>
		</div>
	</div>
	
	<script src='jszip.min.js'></script>
    <script src="Pre1.js"></script>

</body>
</html>
